<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Innovare Checklist</title>
<meta name="description" content="Checklist diário de abertura e fechamento da Innovare Beach Sports Arena.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1567B0">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Innovare Checklist">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --cor-azul: #1567B0;
    --cor-azul-escuro: #0B3358;
    --cor-amarelo: #FFC630;
    --cor-laranja: #FF7A33;
    --cor-fundo: #F4F9FD;
    --cor-superficie: #FFFFFF;
    --cor-texto: #0E2A42;
    --cor-texto-suave: #4F6A80;
    --cor-borda: #E4EEF6;
    --cor-verde: #1E9E6B;
    --cor-vermelho: #E1543D;
    --gradiente-marca: linear-gradient(90deg, var(--cor-azul), var(--cor-laranja), var(--cor-amarelo));
    --fonte-principal: 'Montserrat', system-ui, sans-serif;
    --raio-cartao: 26px;
    --raio-botao: 16px;
    --raio-total: 999px;
    --sombra-suave: 0 10px 30px rgba(11, 51, 88, 0.10);
    --sombra-botao: 0 2px 10px rgba(11, 51, 88, 0.07);
    --transicao-rapida: 0.2s ease;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    font-family: var(--fonte-principal);
    color: var(--cor-texto);
    background: var(--cor-azul);
    background-image:
      radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,0.16), rgba(255,255,255,0) 60%),
      var(--cor-azul);
    display: flex;
    justify-content: center;
    padding: 28px 16px 48px;
  }

  .cartao{
    width: 100%;
    max-width: 480px;
    background: var(--cor-superficie);
    border-radius: var(--raio-cartao);
    box-shadow: var(--sombra-suave);
    border: 1px solid var(--cor-borda);
    padding: 30px 22px 26px;
  }

  /* ---------- Cabeçalho comum (logo + nome) ---------- */
  .cabecalho{
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
  }
  .cabecalho img{
    width: 52px;
    height: 52px;
    border-radius: 14px;
    flex-shrink: 0;
    box-shadow: var(--sombra-botao);
  }
  .cabecalho h1{
    margin: 0;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .cabecalho p{
    margin: 2px 0 0;
    font-size: 0.82rem;
    color: var(--cor-texto-suave);
  }
  .botao-sair{
    margin-left: auto;
    border: 1px solid var(--cor-borda);
    background: var(--cor-fundo);
    color: var(--cor-texto-suave);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: var(--raio-total);
    cursor: pointer;
    transition: background var(--transicao-rapida), color var(--transicao-rapida);
  }
  .botao-sair:hover{ background: var(--cor-borda); color: var(--cor-texto); }

  /* ---------- Tela de login ---------- */
  .tela-login .cabecalho{ flex-direction: column; text-align: center; gap: 10px; margin-bottom: 26px; }
  .tela-login .cabecalho img{ width: 68px; height: 68px; border-radius: 18px; }

  label{
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--cor-texto-suave);
    margin-bottom: 6px;
  }
  input[type="password"],
  input[type="date"]{
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--cor-texto);
    background: var(--cor-fundo);
    border: 1px solid var(--cor-borda);
    border-radius: var(--raio-botao);
    padding: 13px 14px;
    outline: none;
    transition: border-color var(--transicao-rapida);
  }
  input[type="password"]:focus,
  input[type="date"]:focus{ border-color: var(--cor-azul); }

  .campo-lembrar{
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0 20px;
    font-size: 0.85rem;
    color: var(--cor-texto-suave);
  }
  .campo-lembrar input{ width: 17px; height: 17px; accent-color: var(--cor-azul); }

  .botao-principal{
    width: 100%;
    border: none;
    border-radius: var(--raio-botao);
    padding: 14px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--cor-azul), var(--cor-azul-escuro));
    cursor: pointer;
    transition: transform var(--transicao-rapida), box-shadow var(--transicao-rapida), opacity var(--transicao-rapida);
  }
  .botao-principal:hover{ transform: translateY(-2px); box-shadow: var(--sombra-botao); }
  .botao-principal:disabled{ opacity: 0.6; cursor: default; transform: none; box-shadow: none; }

  .mensagem-erro{
    margin: 0 0 14px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(225, 84, 61, 0.1);
    color: var(--cor-vermelho);
    font-size: 0.85rem;
    font-weight: 600;
    display: none;
  }
  .mensagem-erro.visivel{ display: block; }

  /* ---------- App principal ---------- */
  .app{ display: none; }
  .app.visivel{ display: block; }

  .controles{
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 18px;
  }

  .abas-turno{
    display: flex;
    background: var(--cor-fundo);
    border: 1px solid var(--cor-borda);
    border-radius: var(--raio-total);
    padding: 4px;
    gap: 4px;
  }
  .aba-turno{
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--cor-texto-suave);
    padding: 10px 8px;
    border-radius: var(--raio-total);
    cursor: pointer;
    transition: background var(--transicao-rapida), color var(--transicao-rapida);
  }
  .aba-turno.ativa{
    background: var(--cor-superficie);
    color: var(--cor-azul);
    box-shadow: var(--sombra-botao);
  }

  .barra-progresso-linha{
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.8rem;
    color: var(--cor-texto-suave);
    font-weight: 600;
  }
  .barra-progresso{
    flex: 1;
    height: 8px;
    border-radius: var(--raio-total);
    background: var(--cor-fundo);
    border: 1px solid var(--cor-borda);
    overflow: hidden;
  }
  .barra-progresso-preenchida{
    height: 100%;
    width: 0%;
    border-radius: var(--raio-total);
    background: var(--gradiente-marca);
    transition: width 0.3s ease;
  }

  .aviso-status{
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--cor-texto-suave);
    text-align: center;
    margin: -6px 0 4px;
    min-height: 1em;
  }
  .aviso-status.erro{ color: var(--cor-vermelho); }
  .aviso-status.sucesso{ color: var(--cor-verde); }

  .categoria{ margin-bottom: 18px; }
  .categoria:last-child{ margin-bottom: 4px; }
  .titulo-categoria{
    margin: 0 0 10px;
    font-size: 0.8rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--cor-azul);
  }

  .item-checklist{
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 14px;
    border: 1px solid var(--cor-borda);
    border-radius: var(--raio-botao);
    background: var(--cor-fundo);
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color var(--transicao-rapida), background var(--transicao-rapida);
  }
  .item-checklist:hover{ border-color: var(--cor-azul); }
  .item-checklist.concluido{
    background: rgba(30, 158, 107, 0.07);
    border-color: rgba(30, 158, 107, 0.35);
  }

  .caixa-check{
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 7px;
    border: 2px solid var(--cor-borda);
    background: var(--cor-superficie);
    display: grid;
    place-items: center;
    transition: background var(--transicao-rapida), border-color var(--transicao-rapida);
    margin-top: 1px;
  }
  .item-checklist.concluido .caixa-check{
    background: var(--cor-verde);
    border-color: var(--cor-verde);
  }
  .caixa-check svg{
    width: 14px;
    height: 14px;
    color: #fff;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity var(--transicao-rapida), transform var(--transicao-rapida);
  }
  .item-checklist.concluido .caixa-check svg{ opacity: 1; transform: scale(1); }

  .item-checklist input[type="checkbox"]{
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .texto-item{
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.35;
  }
  .item-checklist.concluido .texto-item{
    color: var(--cor-texto-suave);
    text-decoration: line-through;
    text-decoration-color: var(--cor-verde);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

  <!-- ============================================================
       TELA DE LOGIN
       ============================================================ -->
  <div class="cartao tela-login" id="telaLogin">
    <div class="cabecalho">
      <img src="icon-192.png" alt="Logo Innovare">
      <div>
        <h1>Innovare Checklist</h1>
        <p>Checklist diário de abertura e fechamento</p>
      </div>
    </div>

    <p class="mensagem-erro" id="mensagemErroLogin">Senha incorreta. Tente novamente.</p>

    <form id="formularioLogin">
      <label for="campoSenha">Senha de acesso</label>
      <input type="password" id="campoSenha" name="senha" autocomplete="current-password" required>

      <div class="campo-lembrar">
        <input type="checkbox" id="lembrarSenha" checked>
        <label for="lembrarSenha" style="margin:0; font-weight:500;">Lembrar neste aparelho</label>
      </div>

      <button type="submit" class="botao-principal" id="botaoEntrar">Entrar</button>
    </form>
  </div>

  <!-- ============================================================
       APP (checklist)
       ============================================================ -->
  <div class="cartao app" id="app">
    <div class="cabecalho">
      <img src="icon-192.png" alt="Logo Innovare">
      <div>
        <h1>Innovare Checklist</h1>
        <p id="dataPorExtenso">—</p>
      </div>
      <button type="button" class="botao-sair" id="botaoSair">Sair</button>
    </div>

    <div class="controles">
      <div>
        <label for="campoData">Dia</label>
        <input type="date" id="campoData">
      </div>

      <div class="abas-turno">
        <button type="button" class="aba-turno ativa" data-turno="Abertura">Abertura</button>
        <button type="button" class="aba-turno" data-turno="Fechamento">Fechamento</button>
      </div>

      <div class="barra-progresso-linha">
        <div class="barra-progresso"><div class="barra-progresso-preenchida" id="barraPreenchida"></div></div>
        <span id="textoProgresso">0 de 0</span>
      </div>

      <p class="aviso-status" id="avisoStatus"></p>
    </div>

    <div id="listaCategorias"></div>
  </div>

<script>
  // ============================================================
  // CONFIGURAÇÃO
  // ============================================================
  const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbwEN2gCdazkLSoltQAPtJRwG96y28DtB0NgJ_akUMT4kZxVOa-WGR8WUR42r1mohBDn/exec';

  // Itens do checklist, organizados por turno e categoria.
  // Para adicionar/remover um item no futuro, basta editar esta lista.
  const ITENS = {
    Abertura: [
      { categoria: 'Equipamentos', itens: [
        'Tablet carregado',
        'Notebook carregado',
        'Ligar TV',
        'Máquina de passar cartão conferida',
      ]},
      { categoria: 'Materiais de aula', itens: [
        'Bolas dos carrinhos (Beach Tênnis)',
        'Bolas de futevôlei',
        'Cones',
        'Raquetes',
      ]},
    ],
    Fechamento: [
      { categoria: 'Segurança e fechamento', itens: [
        'Refletores das quadras desligados',
        'Lâmpadas das áreas internas desligadas (escritório, banheiro, jardim, bar)',
        'Portões das quadras fechados',
        'Alarme ativado',
        'Materiais das aulas guardados e limpos',
        'Portas das áreas internas trancadas',
      ]},
      { categoria: 'Limpeza', itens: [
        'Banheiros limpos',
        'Papel higiênico e papel toalha abastecidos',
        'Área social limpa',
        'Corredor de acesso às quadras limpo',
        'Quadras rasteladas',
        'Período de sanitização das quadras verificado',
        'Período de troca de extintores verificado',
        'Data de troca do filtro do bebedouro verificada',
      ]},
    ],
  };

  // ============================================================
  // ESTADO
  // ============================================================
  let senhaAtual = localStorage.getItem('innovareChecklistSenha') || sessionStorage.getItem('innovareChecklistSenha') || '';
  let turnoAtual = 'Abertura';
  let statusItens = {}; // { "nome do item": true/false }

  const elTelaLogin = document.getElementById('telaLogin');
  const elApp = document.getElementById('app');
  const elFormularioLogin = document.getElementById('formularioLogin');
  const elCampoSenha = document.getElementById('campoSenha');
  const elLembrarSenha = document.getElementById('lembrarSenha');
  const elBotaoEntrar = document.getElementById('botaoEntrar');
  const elMensagemErroLogin = document.getElementById('mensagemErroLogin');
  const elBotaoSair = document.getElementById('botaoSair');
  const elCampoData = document.getElementById('campoData');
  const elDataPorExtenso = document.getElementById('dataPorExtenso');
  const elAbasTurno = document.querySelectorAll('.aba-turno');
  const elListaCategorias = document.getElementById('listaCategorias');
  const elBarraPreenchida = document.getElementById('barraPreenchida');
  const elTextoProgresso = document.getElementById('textoProgresso');
  const elAvisoStatus = document.getElementById('avisoStatus');

  function dataDeHoje(){
    const agora = new Date();
    const ano = agora.getFullYear();
    const mes = String(agora.getMonth() + 1).padStart(2, '0');
    const dia = String(agora.getDate()).padStart(2, '0');
    return `${ano}-${mes}-${dia}`;
  }

  function formatarDataPorExtenso(dataISO){
    const [ano, mes, dia] = dataISO.split('-').map(Number);
    const data = new Date(ano, mes - 1, dia);
    return data.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function horaAtual(){
    return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  // ============================================================
  // LOGIN
  // ============================================================
  function mostrarApp(){
    elTelaLogin.style.display = 'none';
    elApp.classList.add('visivel');
    elCampoData.value = dataDeHoje();
    atualizarDataPorExtenso();
    carregarStatus();
  }

  function mostrarLogin(mensagemErro){
    elApp.classList.remove('visivel');
    elTelaLogin.style.display = 'block';
    if(mensagemErro){
      elMensagemErroLogin.textContent = mensagemErro;
      elMensagemErroLogin.classList.add('visivel');
    }
  }

  async function validarSenha(senha){
    const parametros = new URLSearchParams({
      acao: 'status',
      senha,
      data: dataDeHoje(),
      turno: 'Abertura',
    });
    const resposta = await fetch(`${URL_SCRIPT}?${parametros.toString()}`);
    const json = await resposta.json();
    return json.sucesso === true;
  }

  elFormularioLogin.addEventListener('submit', async (evento) => {
    evento.preventDefault();
    elMensagemErroLogin.classList.remove('visivel');
    elBotaoEntrar.disabled = true;
    elBotaoEntrar.textContent = 'Verificando…';

    const senhaDigitada = elCampoSenha.value.trim();
    try{
      const senhaValida = await validarSenha(senhaDigitada);
      if(!senhaValida){
        elMensagemErroLogin.textContent = 'Senha incorreta. Tente novamente.';
        elMensagemErroLogin.classList.add('visivel');
        elCampoSenha.value = '';
        elCampoSenha.focus();
        return;
      }
      senhaAtual = senhaDigitada;
      if(elLembrarSenha.checked){
        localStorage.setItem('innovareChecklistSenha', senhaAtual);
      } else {
        sessionStorage.setItem('innovareChecklistSenha', senhaAtual);
      }
      mostrarApp();
    } catch(erro){
      elMensagemErroLogin.textContent = 'Não foi possível conectar. Confira sua internet e tente de novo.';
      elMensagemErroLogin.classList.add('visivel');
    } finally {
      elBotaoEntrar.disabled = false;
      elBotaoEntrar.textContent = 'Entrar';
    }
  });

  elBotaoSair.addEventListener('click', () => {
    senhaAtual = '';
    localStorage.removeItem('innovareChecklistSenha');
    sessionStorage.removeItem('innovareChecklistSenha');
    elCampoSenha.value = '';
    mostrarLogin();
  });

  // ============================================================
  // TROCA DE DIA / TURNO
  // ============================================================
  function atualizarDataPorExtenso(){
    elDataPorExtenso.textContent = formatarDataPorExtenso(elCampoData.value || dataDeHoje());
  }

  elCampoData.addEventListener('change', () => {
    atualizarDataPorExtenso();
    carregarStatus();
  });

  elAbasTurno.forEach((botao) => {
    botao.addEventListener('click', () => {
      elAbasTurno.forEach((b) => b.classList.remove('ativa'));
      botao.classList.add('ativa');
      turnoAtual = botao.dataset.turno;
      carregarStatus();
    });
  });

  // ============================================================
  // CARREGAR STATUS DO DIA/TURNO SELECIONADO
  // ============================================================
  async function carregarStatus(){
    definirAviso('Carregando…');
    try{
      const parametros = new URLSearchParams({
        acao: 'status',
        senha: senhaAtual,
        data: elCampoData.value,
        turno: turnoAtual,
      });
      const resposta = await fetch(`${URL_SCRIPT}?${parametros.toString()}`);
      const json = await resposta.json();

      if(json.erro === 'Senha incorreta'){
        mostrarLogin('Sua sessão expirou. Digite a senha novamente.');
        return;
      }

      statusItens = json.itens || {};
      renderizarLista();
      definirAviso('');
    } catch(erro){
      statusItens = {};
      renderizarLista();
      definirAviso('Sem conexão — não foi possível carregar o status salvo.', 'erro');
    }
  }

  function definirAviso(texto, tipo){
    elAvisoStatus.textContent = texto || '';
    elAvisoStatus.classList.remove('erro', 'sucesso');
    if(tipo) elAvisoStatus.classList.add(tipo);
  }

  // ============================================================
  // RENDERIZAR A LISTA DE ITENS
  // ============================================================
  function renderizarLista(){
    const grupos = ITENS[turnoAtual] || [];
    elListaCategorias.innerHTML = '';

    grupos.forEach((grupo) => {
      const secao = document.createElement('div');
      secao.className = 'categoria';

      const titulo = document.createElement('p');
      titulo.className = 'titulo-categoria';
      titulo.textContent = grupo.categoria;
      secao.appendChild(titulo);

      grupo.itens.forEach((textoItem) => {
        const concluido = Boolean(statusItens[textoItem]);
        const linha = document.createElement('label');
        linha.className = 'item-checklist' + (concluido ? ' concluido' : '');
        linha.innerHTML = `
          <input type="checkbox" ${concluido ? 'checked' : ''}>
          <span class="caixa-check" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
          </span>
          <span class="texto-item">${textoItem}</span>
        `;
        linha.querySelector('input').addEventListener('change', (evento) => {
          alternarItem(grupo.categoria, textoItem, evento.target.checked, linha);
        });
        secao.appendChild(linha);
      });

      elListaCategorias.appendChild(secao);
    });

    atualizarProgresso();
  }

  function atualizarProgresso(){
    const grupos = ITENS[turnoAtual] || [];
    const todosOsItens = grupos.flatMap((g) => g.itens);
    const totalConcluidos = todosOsItens.filter((item) => statusItens[item]).length;
    const total = todosOsItens.length;
    const percentual = total ? Math.round((totalConcluidos / total) * 100) : 0;

    elBarraPreenchida.style.width = `${percentual}%`;
    elTextoProgresso.textContent = `${totalConcluidos} de ${total}`;
  }

  // ============================================================
  // MARCAR / DESMARCAR UM ITEM (envia pro Google Sheets)
  // ============================================================
  async function alternarItem(categoria, item, feito, elementoLinha){
    // Atualização otimista: já reflete na tela antes da resposta do servidor
    statusItens[item] = feito;
    elementoLinha.classList.toggle('concluido', feito);
    atualizarProgresso();
    definirAviso('Salvando…');

    try{
      const resposta = await fetch(URL_SCRIPT, {
        method: 'POST',
        body: JSON.stringify({
          senha: senhaAtual,
          data: elCampoData.value,
          turno: turnoAtual,
          categoria,
          item,
          feito,
          hora: horaAtual(),
        }),
      });
      const json = await resposta.json();

      if(json.erro === 'Senha incorreta'){
        mostrarLogin('Sua sessão expirou. Digite a senha novamente.');
        return;
      }
      if(!json.sucesso){
        throw new Error(json.erro || 'Falha ao salvar');
      }
      definirAviso('Salvo ✓', 'sucesso');
      setTimeout(() => definirAviso(''), 1500);
    } catch(erro){
      // Reverte a marcação, já que não foi possível confirmar o salvamento
      statusItens[item] = !feito;
      elementoLinha.classList.toggle('concluido', !feito);
      elementoLinha.querySelector('input').checked = !feito;
      atualizarProgresso();
      definirAviso('Não foi possível salvar. Confira sua internet e marque de novo.', 'erro');
    }
  }

  // ============================================================
  // INICIALIZAÇÃO
  // ============================================================
  if(senhaAtual){
    mostrarApp();
  } else {
    mostrarLogin();
  }

  // Registra o service worker (permite abrir o app mesmo sem internet)
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
